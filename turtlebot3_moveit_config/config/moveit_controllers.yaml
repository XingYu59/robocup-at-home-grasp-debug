# MoveIt controller configuration.
#
# Uses MoveItSimpleControllerManager: the controllers are ALREADY spawned by
# turtlebot3_manipulation_gazebo/launch/turtlebot3_franka.launch.py, so MoveIt
# must NOT try to spawn them again (no ros2_control MoveIt manager).
#
#   arm_controller     -> JointTrajectoryController  (FollowJointTrajectory action)
#   gripper_controller -> GripperActionController    (GripperCommand action)

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - arm_controller
    - gripper_controller

  arm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - fr3_joint1
      - fr3_joint2
      - fr3_joint3
      - fr3_joint4
      - fr3_joint5
      - fr3_joint6
      - fr3_joint7

  gripper_controller:
    type: GripperCommand
    action_ns: gripper_cmd
    default: true
    joints:
      - fr3_finger_joint1
