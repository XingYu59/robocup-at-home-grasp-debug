# OMPL planning configuration (loaded into the "ompl" planning pipeline).

planning_plugin: ompl_interface/OMPLPlanner
request_adapters: >-
  default_planner_request_adapters/AddTimeOptimalParameterization
  default_planner_request_adapters/ResolveConstraintFrames
  default_planner_request_adapters/FixWorkspaceBounds
  default_planner_request_adapters/FixStartStateBounds
  default_planner_request_adapters/FixStartStateCollision
  default_planner_request_adapters/FixStartStatePathConstraints
start_state_max_bounds_error: 0.1

planner_configs:
  SBL:
    type: geometric::SBL
    range: 0.0
  EST:
    type: geometric::EST
    range: 0.0
  LBKPIECE:
    type: geometric::LBKPIECE
    range: 0.0
  BKPIECE:
    type: geometric::BKPIECE
    range: 0.0
  KPIECE:
    type: geometric::KPIECE
    range: 0.0
  RRT:
    type: geometric::RRT
    range: 0.0
  RRTConnect:
    type: geometric::RRTConnect
    range: 0.0
  RRTstar:
    type: geometric::RRTstar
    range: 0.0
  TRRT:
    type: geometric::TRRT
    range: 0.0
  PRM:
    type: geometric::PRM
    max_nearest_neighbors: 10
  PRMstar:
    type: geometric::PRMstar
    max_nearest_neighbors: 10
  FMT:
    type: geometric::FMT
    num_samples: 1000
    radius_multiplier: 1.1
    nearest_k: 1
    cache_cc: 1
    heuristics: 0
    cost_threshold: 1e9
  BFMT:
    type: geometric::BFMT
    num_samples: 1000
    radius_multiplier: 1.0
    nearest_k: 1
    balanced: 0
    optimality: 1
    heuristics: 1
    cache_cc: 1
    cost_threshold: 1e9
  PDST:
    type: geometric::PDST
    range: 0.0
  STRIDE:
    type: geometric::STRIDE
    range: 0.0
    degree: 16
    max_degree: 16
    min_valid_path_fraction: 0.2
    estimated_dimension: 2
    min_degree: 2
  BiTRRT:
    type: geometric::BiTRRT
    range: 0.0
    temp_change_factor: 0.1
    init_temperature: 100
    frontier_threshold: 0.0
    frontier_node_ratio: 0.1
    cost_threshold: 1e9
  LBTRRT:
    type: geometric::LBTRRT
    range: 0.0
    goal_bias: 0.05
    epsilon: 0.4
    init_epsilon: 1.0
    incremental_epsilon: 0.05
  BiEST:
    type: geometric::BiEST
    range: 0.0
  ProjEST:
    type: geometric::ProjEST
    range: 0.0
  LazyPRM:
    type: geometric::LazyPRM
    range: 0.0
  LazyPRMstar:
    type: geometric::LazyPRMstar
    max_nearest_neighbors: 10
  SPARS:
    type: geometric::SPARS
    max_nearest_neighbors: 10
    dense_delta_fraction: 0.001
    sparse_delta_fraction: 0.25
    stretch_factor: 3.0
  SPARStwo:
    type: geometric::SPARStwo
    max_nearest_neighbors: 10
    dense_delta_fraction: 0.001
    sparse_delta_fraction: 0.25
    stretch_factor: 4.0

arm:
  default_planner_config: RRTConnect
  planner_configs:
    - SBL
    - EST
    - LBKPIECE
    - BKPIECE
    - KPIECE
    - RRT
    - RRTConnect
    - RRTstar
    - TRRT
    - PRM
    - PRMstar
    - FMT
    - BFMT
    - PDST
    - STRIDE
    - BiTRRT
    - LBTRRT
    - BiEST
    - ProjEST
    - LazyPRM
    - LazyPRMstar
    - SPARS
    - SPARStwo
  projection_evaluator: joints(fr3_joint1,fr3_joint2)
  longest_valid_segment_fraction: 0.005
